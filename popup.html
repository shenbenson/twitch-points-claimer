<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; background: #18181b; color: #efeff1; }
    h1 { font-size: 15px; margin: 0 0 12px; color: #bf94ff; }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
    .stat { font-size: 22px; font-weight: 700; }
    .muted { color: #adadb8; font-size: 12px; }
    ul { list-style: none; padding: 0; margin: 6px 0 0; max-height: 140px; overflow-y: auto; }
    li { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #2f2f35; }
    button { background: #2f2f35; color: #efeff1; border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; width: 100%; margin-top: 10px; }
    button:hover { background: #3f3f46; }
    input[type=checkbox] { width: 18px; height: 18px; accent-color: #9147ff; }
  </style>
</head>
<body>
  <h1>Channel Points Auto Claimer</h1>
  <div class="row"><label for="enabled">Auto-claim enabled</label><input type="checkbox" id="enabled"></div>
  <div class="row"><span>Total claims</span><span class="stat" id="total">0</span></div>
  <div class="muted" id="last">No claims yet</div>
  <div class="muted" style="margin-top:10px">By channel</div>
  <ul id="channels"></ul>
  <button id="reset">Reset stats</button>
  <script src="popup.js"></script>
</body>
</html>
